<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 500 330" width="500" height="330" role="img" aria-label="Orb: Private, offline AI for Android. Chat, ask about photos and documents, and talk by voice, with no account and no cloud."><title>Orb: Private, offline AI for Android. Chat, ask about photos and documents, and talk by voice, with no account and no cloud.</title><style>
