<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 500 330" width="500" height="330" role="img" aria-label="Link: Run the coding agents on your own computer from your phone. Start a task, review the change and approve it."><title>Link: Run the coding agents on your own computer from your phone. Start a task, review the change and approve it.</title><style>
      text { font-family: -apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
