<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 500 330" width="500" height="330" role="img" aria-label="Razin OCR: OCR for images and scanned PDFs on your own hardware, made to be especially good at Arabic, dots and diacritics included."><title>Razin OCR: OCR for images and scanned PDFs on your own hardware, made to be especially good at Arabic, dots and diacritics included.</title><style>
