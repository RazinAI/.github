<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 328" width="1000" height="328" role="img" aria-label="Razin OCR: where pretrained models stand on Arabic (lower is better)"><title>Razin OCR: where pretrained models stand on Arabic (lower is better)</title><style>
      text { font-family: -apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
