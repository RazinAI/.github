    </style><rect x=".5" y=".5" width="999" height="327" rx="18" fill="#2A1712" stroke="#45302A"/><text class="title" x="36" y="52">Razin OCR: where pretrained models stand on Arabic (lower is better)</text><text class="label" x="36" y="116">Tesseract fast</text><rect class="bar" style="animation-delay:0.00s" x="230" y="100" width="440.0" height="22" rx="4" fill="#5E4A42"/><text class="val" style="animation-delay:0.50s" x="680.0" y="116">52.80%  CER   0.199 s/image</text><text class="label" x="36" y="180">Tesseract best</text><rect class="bar" style="animation-delay:0.08s" x="230" y="164" width="350.2" height="22" rx="4" fill="#5E4A42"/><text class="val" style="animation-delay:0.58s" x="590.2" y="180">42.03%  CER   0.288 s/image</text><text class="label" x="36" y="244">PaddleOCR PP-OCRv5</text><rect class="bar" style="animation-delay:0.16s" x="230" y="228" width="126.9" height="22" rx="4" fill="#E8956A"/><text class="val" style="animation-delay:0.66s" x="366.9" y="244">15.23%  CER   1.888 s/image</text><text class="note" x="36" y="300">14 synthetic Arabic pages, CPU, 6 September 2026. Diagnostics, not accuracy on your documents.</text></svg>