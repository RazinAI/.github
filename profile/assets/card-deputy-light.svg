<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 500 330" width="500" height="330" role="img" aria-label="Deputy: An agent in your browser that turns any page into a typed API for other agents. One call instead of screenshots and clicks."><title>Deputy: An agent in your browser that turns any page into a typed API for other agents. One call instead of screenshots and clicks.</title><style>
      text { font-family: -apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .name { font-size: 30px; font-weight: 750; fill: #2A1612; }
      .kind { font-size: 17px; fill: #6A5F55; }
      .pill { font-size: 14px; font-weight: 600; fill: #9A3A1E; }
      .desc { font-size: 19px; fill: #2A1612; }
      .fk { font-size: 15px; fill: #6A5F55; }
      .fv { font-size: 15px; fill: #2A1612; font-weight: 600; }
      .card { animation: in .7s ease-out both; }
      @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; } }
      .pulse { animation: pulse 1.8s ease-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes pulse { from { opacity: .7; transform: scale(1); } to { opacity: 0; transform: scale(2.6); } }
      .scan { animation: scan 2.6s ease-in-out infinite alternate; }
      @keyframes scan { from { transform: translateY(0); } to { transform: translateY(42px); } }
    </style>
      <g class="card">
        <rect x=".5" y=".5" width="499" height="329" rx="18" fill="#FBF9F3" stroke="#DCD4C0"/>
        <g transform="translate(36 30)"><image x="0" y="0" width="64" height="64" href="data:image/svg+xml;base64,"/></g>
        <text class="name" x="118" y="58">Deputy</text>
        <text class="kind" x="118" y="82">Agent tool</text>
        <rect x="290.6" y="33" width="173.39999999999998" height="28" rx="14" fill="none" stroke="#9A3A1E" stroke-opacity=".55"/>
        <circle cx="306.6" cy="47" r="4" fill="#9A3A1E"/>
        <text class="pill" x="318.6" y="52">Developer preview</text>
        <text class="desc" x="36" y="140">An agent in your browser that turns any page</text><text class="desc" x="36" y="167">into a typed API for other agents. One call</text><text class="desc" x="36" y="194">instead of screenshots and clicks.</text>
        <line x1="36" x2="464" y1="224" y2="224" stroke="#DCD4C0"/>
        <text class="fk" x="36" y="252">Runs in</text><text class="fv" x="118" y="252">Your logged-in browser</text><text class="fk" x="36" y="277">Talks to</text><text class="fv" x="118" y="277">Any MCP client</text><text class="fk" x="36" y="302">Install</text><text class="fv" x="118" y="302">Chrome + npx deputy-mcp</text>
      </g>
    </svg>